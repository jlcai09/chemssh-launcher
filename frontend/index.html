<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>ChemSSH Launcher</title>
    <script>
      if (window.parent !== window) {
        document.documentElement.classList.add('is-embedded-frame');
        try {
          if (!window.__TAURI_INTERNALS__ && window.parent.__TAURI_INTERNALS__) {
            window.__TAURI_INTERNALS__ = window.parent.__TAURI_INTERNALS__;
            window.isTauri = true;
          }
          if (
            !window.__TAURI_EVENT_PLUGIN_INTERNALS__ &&
            window.parent.__TAURI_EVENT_PLUGIN_INTERNALS__
          ) {
            window.__TAURI_EVENT_PLUGIN_INTERNALS__ =
              window.parent.__TAURI_EVENT_PLUGIN_INTERNALS__;
          }
        } catch (e) {}
      }
    </script>
    <style>
      /* Minimal flat splash matching the #f6f6f7 application shell background
         so startup and tab switches never flash a mismatched gradient or card. */
      html,
      body {
        height: 100%;
        margin: 0;
        background: #f6f6f7;
        color: #1d1d1f;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      html.is-embedded-frame #app-splash {
        display: none !important;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f6f7;
      }
      .splash-minimal {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        user-select: none;
      }
      .splash-spinner {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 1.5px solid rgba(29, 29, 31, 0.12);
        border-top-color: #6e6e73;
        animation: splash-spin 0.75s linear infinite;
      }
      .splash-label {
        font-size: 12.5px;
        font-weight: 500;
        color: #86868b;
        letter-spacing: 0.1px;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-spinner {
          animation: none !important;
          border-color: rgba(29, 29, 31, 0.28);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-splash" role="status" aria-live="polite">
        <div class="splash-minimal">
          <span class="splash-spinner" aria-hidden="true"></span>
          <span class="splash-label">ChemSSH</span>
        </div>
      </div>
    </div>
    <script>
      (function () {
        function reveal() {
          try {
            if (window.__chemsshRevealWindow) window.__chemsshRevealWindow();
          } catch (e) {}
        }
        reveal();
        document.addEventListener('DOMContentLoaded', reveal, { once: true });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
