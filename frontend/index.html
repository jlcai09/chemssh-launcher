<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChemSSH Launcher</title>
    <style>
      /* Splash screen — shown before Vue mounts and removed as soon as
         <App> replaces the contents of #app. To stay in lockstep with the
         main app's "Low effects mode" (no backdrop-filter, no box-shadow,
         no resource-heavy gradients), this page uses only solid surfaces,
         system fonts, and tight CSS-compositor animations (transform /
         opacity). The body background is the same #e8eef3 as the main
         app bg, so removing the splash does not reveal a colour flash. */
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        color: #172633;
        background: #e8eef3;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei",
          Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .splash-card {
        width: min(360px, 92vw);
        padding: 32px 36px 28px;
        border: 1px solid #ccd7df;
        border-radius: 12px;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .splash-logo {
        width: 56px;
        height: 56px;
        margin-bottom: 18px;
        color: #0e7490;
      }
      .splash-ring {
        transform-origin: 50% 50%;
        animation: splash-spin 2.4s linear infinite;
      }
      .splash-title {
        margin: 0 0 6px 0;
        font-size: 17px;
        font-weight: 700;
        color: #172633;
        letter-spacing: 0.2px;
      }
      .splash-subtitle {
        margin: 0;
        font-size: 13px;
        color: #566777;
        letter-spacing: 0.15px;
        white-space: nowrap;
      }
      .splash-dot {
        display: inline-block;
        width: 4px;
        height: 4px;
        margin: 0 1px;
        border-radius: 50%;
        background: #566777;
        vertical-align: middle;
        opacity: 0.25;
        animation: splash-fade 1.4s linear infinite;
      }
      .splash-dot:nth-of-type(2) {
        animation-delay: 0.2s;
      }
      .splash-dot:nth-of-type(3) {
        animation-delay: 0.4s;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes splash-fade {
        0%,
        80%,
        100% {
          opacity: 0.25;
        }
        40% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-ring,
        .splash-dot {
          animation: none !important;
        }
        .splash-ring {
          opacity: 0.6;
        }
        .splash-dot {
          opacity: 1;
        }
      }
      @media (prefers-contrast: more) {
        body {
          background: #eef3f6;
        }
        .splash-card {
          border-color: #748294;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-splash">
        <div class="splash-card" role="status" aria-live="polite">
          <svg
            class="splash-logo"
            viewBox="0 0 56 56"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <circle cx="28" cy="28" r="15" fill="#0e7490" />
            <path
              d="M 33 21 A 9 9 0 1 0 33 35"
              stroke="#ffffff"
              stroke-width="2.5"
              stroke-linecap="round"
            />
            <g class="splash-ring">
              <circle
                cx="28"
                cy="28"
                r="23"
                stroke="#0e7490"
                stroke-width="1.5"
                stroke-dasharray="3 5"
                opacity="0.45"
              />
              <circle cx="28" cy="5" r="2.5" fill="#0e7490" />
              <circle cx="8" cy="39" r="2.5" fill="#0e7490" />
              <circle cx="48" cy="39" r="2.5" fill="#0e7490" />
            </g>
          </svg>
          <h2 class="splash-title">ChemSSH Launcher</h2>
          <p class="splash-subtitle">
            正在准备安全会话<span class="splash-dot"></span><span
              class="splash-dot"
            ></span
            ><span class="splash-dot"></span>
          </p>
        </div>
      </div>
    </div>
    <script>
      // Reveal the native WebView2 window as soon as this loading page is parsed.
      // The bridge is injected by the host before body scripts run; this call is
      // synchronous so it works even while the window is still hidden (where
      // requestAnimationFrame may be paused). The host ignores extra calls.
      (function () {
        function reveal() {
          try {
            if (window.__chemsshRevealWindow) window.__chemsshRevealWindow();
          } catch (e) {}
        }
        reveal();
        document.addEventListener('DOMContentLoaded', reveal, { once: true });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
