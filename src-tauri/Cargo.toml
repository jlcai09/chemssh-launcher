[package]
name = "chemssh-launcher-tauri"
version.workspace = true
edition.workspace = true
description = "ChemSSH Launcher desktop shell (Tauri v2)"

[lib]
name = "chemssh_launcher_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
bytes = "1"
chrono = "0.4"
core-config = { path = "../crates/core-config" }
core-installer = { path = "../crates/core-installer" }
core-secret = { path = "../crates/core-secret" }
core-session = { path = "../crates/core-session" }
core-ssh = { path = "../crates/core-ssh" }
core-transfer = { path = "../crates/core-transfer" }
flate2 = "1"
hex = "0.4"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
percent-encoding = "2"
rand = "0.9"
win-native = { path = "../crates/win-native" }
russh-sftp = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2", default-features = false, features = ["gtk3"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "sync", "time"] }
url = "2"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
