[package]
name = "chemssh-launcher-tauri"
version.workspace = true
edition.workspace = true
description = "ChemSSH Launcher desktop shell (Tauri v2)"

[lib]
name = "chemssh_launcher_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
core-config = { path = "../crates/core-config" }
core-secret = { path = "../crates/core-secret" }
core-session = { path = "../crates/core-session" }
core-ssh = { path = "../crates/core-ssh" }
core-transfer = { path = "../crates/core-transfer" }
win-native = { path = "../crates/win-native" }
russh-sftp = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "sync", "time"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
