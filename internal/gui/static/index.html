<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chemweb Launcher</title>
    <link rel="icon" href="/static/chemweb-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <span class="mark"><img src="/static/chemweb-icon.svg" alt="" aria-hidden="true" /></span>
        <div>
          <h1>Chemweb Launcher</h1>
          <p><span data-i18n="tagline">远程 Chemweb 启动器</span> · <span id="appVersion">v...</span></p>
        </div>
      </div>
      <label class="language-switch"><span data-i18n="language">语言</span><select id="language"><option value="zh-CN">中文</option><option value="en">English</option></select></label>
      <div class="profile-actions">
        <button id="newProfile" class="primary" data-i18n="newProfile">新建配置</button>
        <button id="refreshProfiles" data-i18n="refresh">刷新</button>
      </div>
      <nav id="profiles" class="profiles"></nav>
    </aside>

    <main class="workspace">
      <section class="toolbar">
        <div>
          <h2 id="heading">配置</h2>
          <p id="summary">创建或选择一个远程服务器配置。</p>
        </div>
        <div class="runbar">
          <span id="notice" class="notice"></span>
          <span id="status" class="status">空闲</span>
          <button id="testProfile" data-i18n="testSsh">测试 SSH</button>
          <button id="startSession" class="primary" data-i18n="start">启动</button>
          <button id="stopForwarding" class="danger" data-i18n="stopForwarding">停止转发</button>
          <details class="more-menu">
            <summary data-i18n="more">更多</summary>
            <button id="stopService" class="danger" type="button" data-i18n="stopService">停止服务+转发</button>
          </details>
        </div>
      </section>

      <section class="content">
        <form id="profileForm" class="editor">
          <input type="hidden" id="profileId" />

          <fieldset>
            <legend data-i18n="server">服务器</legend>
            <label><span data-i18n="name">名称</span><input id="name" required /></label>
            <label><span data-i18n="sshHost">SSH 主机</span><input id="sshHost" required /></label>
            <label><span data-i18n="sshPort">SSH 端口</span><input id="sshPort" inputmode="numeric" /></label>
            <label><span data-i18n="sshUser">SSH 用户</span><input id="sshUser" required /></label>
            <label><span data-i18n="authMethod">认证方式</span><select id="authMethod"><option value="password" data-i18n="passwordAuth">密码</option><option value="private_key" data-i18n="privateKeyAuth">私钥</option></select></label>
            <label class="key-field"><span data-i18n="privateKeyPath">私钥路径</span><input id="privateKeyPath" /></label>
          </fieldset>

          <fieldset>
            <legend data-i18n="secrets">密钥</legend>
            <div class="secret-line password-field">
              <label><span data-i18n="password">密码</span><input id="passwordDisplay" type="password" readonly title="Saved secrets are never displayed. Click Edit to replace or clear this value." /></label>
              <button id="editPassword" type="button" data-i18n="edit">编辑</button>
            </div>
            <div class="secret-line key-field">
              <label><span data-i18n="keyPassphrase">私钥口令</span><input id="passphraseDisplay" type="password" readonly title="Saved secrets are never displayed. Click Edit to replace or clear this value." /></label>
              <button id="editPassphrase" type="button" data-i18n="edit">编辑</button>
            </div>
            <input id="password" type="password" autocomplete="new-password" hidden />
            <input id="passphrase" type="password" autocomplete="new-password" hidden />
          </fieldset>

          <fieldset>
            <legend data-i18n="tunnel">隧道</legend>
            <label><span data-i18n="remoteHost">远端主机</span><input id="remoteHost" /></label>
            <label><span data-i18n="remotePort">远端端口</span><input id="remotePort" inputmode="numeric" /></label>
            <label><span data-i18n="localHost">本地主机</span><input id="localHost" /></label>
            <label><span data-i18n="localPort">本地端口</span><input id="localPort" inputmode="numeric" /></label>
            <label><span data-i18n="localUrlPath">本地 URL 路径</span><input id="localUrlPath" /></label>
            <label><span data-i18n="healthCheckUrl">健康检查 URL</span><input id="healthCheckUrl" /></label>
            <label class="check"><input id="openBrowser" type="checkbox" /> <span data-i18n="openBrowser">启动后打开 Chemweb 标签页</span></label>
          </fieldset>

          <fieldset class="commands">
            <legend data-i18n="remoteCommands">远端命令</legend>
            <label><span data-i18n="preStartCommands">预启动命令</span><textarea id="preStartCommands" rows="6"></textarea></label>
            <label><span data-i18n="startCommand">启动命令</span><textarea id="startCommand" rows="4"></textarea><span class="hint" data-i18n="startHint">如果命令里没有 --host 或 --port，会自动追加远端主机和端口。</span></label>
          </fieldset>

          <div class="form-actions">
            <button type="submit" class="primary" data-i18n="saveProfile">保存配置</button>
            <button type="button" id="deleteProfile" class="danger" data-i18n="delete">删除</button>
          </div>
        </form>

        <section class="logs">
          <div class="logs-title">
            <h2 data-i18n="sessionLogs">会话日志</h2>
            <button id="refreshLogs" data-i18n="refresh">刷新</button>
          </div>
          <pre id="logs"></pre>
        </section>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
