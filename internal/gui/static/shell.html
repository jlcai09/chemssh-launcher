<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChemSSH Browser</title>
    <link rel="icon" href="/static/chemssh-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/shell.css" />
  </head>
  <body>
    <header class="browser-chrome">
      <div id="tabs" class="tabs" role="tablist">
        <button id="newTab" class="new-tab-button" type="button" title="新建标签页">+</button>
      </div>
      <div class="navline">
        <button id="back" title="后退">‹</button>
        <button id="forward" title="前进">›</button>
        <button id="reload" title="刷新">⟳</button>
        <form id="addressForm" class="address-form">
          <input id="address" autocomplete="off" spellcheck="false" />
        </form>
        <button id="downloads" class="downloads-button" title="下载" aria-label="下载">
          <svg aria-hidden="true" viewBox="0 0 20 20">
            <path d="M10 3v9m0 0 4-4m-4 4L6 8" />
            <path d="M4 15.5h12" />
          </svg>
        </button>
      </div>
    </header>
    <main id="pages" class="pages">
      <div id="downloadsBackdrop" class="downloads-backdrop" hidden></div>
    </main>
    <nav id="tabMenu" class="context-menu" hidden>
      <button type="button" data-action="newRight">右侧新建标签页</button>
      <button type="button" data-action="reload">重新加载</button>
      <button type="button" data-action="copy">复制标签页</button>
      <hr />
      <button type="button" data-action="close">关闭</button>
      <button type="button" data-action="closeRight">关闭右侧标签页</button>
      <button type="button" data-action="closeOthers">关闭其他标签页</button>
    </nav>
    <nav id="editMenu" class="context-menu" hidden>
      <button type="button" data-action="copy">复制</button>
      <button type="button" data-action="paste">粘贴</button>
      <button type="button" data-action="selectAll">全选</button>
    </nav>
    <script src="/static/shell.js"></script>
  </body>
</html>
